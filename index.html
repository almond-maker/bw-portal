<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BW Club — PM Agency Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#0B0C10;color:#ECEAE5}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
select option{background:#14151B;color:#ECEAE5}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0B0C10}
::-webkit-scrollbar-thumb{background:#262733;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── CONFIG ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ybkysfhsnpvqayhtaknx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Hhntaf2L8SKdmIsVSySYWA_6gYKMEkG';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ─── COLORS ─────────────────────────────────────────────────────────────
const C = {
  bg:'#0B0C10',surface:'#14151B',alt:'#1A1B23',hover:'#1E1F28',border:'#262733',
  accent:'#C9A84C',accentDim:'#C9A84C25',accentGlow:'#C9A84C10',accentMed:'#C9A84C50',
  text:'#ECEAE5',sub:'#908F9A',muted:'#5A596A',
  green:'#4ADE80',greenDim:'#4ADE8018',red:'#F87171',redDim:'#F8717118',
  yellow:'#FBBF24',yellowDim:'#FBBF2418',blue:'#60A5FA',blueDim:'#60A5FA18',
  purple:'#A78BFA',purpleDim:'#A78BFA18',orange:'#FB923C',orangeDim:'#FB923C18',
};
const F = {body:"'DM Sans',sans-serif",display:"'Playfair Display',serif"};

// ─── SHARED UI ──────────────────────────────────────────────────────────
const Badge=({label,color,bg})=><span style={{display:'inline-flex',padding:'3px 10px',borderRadius:20,fontSize:10.5,fontWeight:650,color,background:bg,letterSpacing:'0.03em'}}>{label}</span>;

function MetricTile({label,value,prev,format,invert}){
  const fmt=(v)=>format==='$'?`$${parseFloat(v||0).toFixed(2)}`:format==='%'?`${v}%`:(v||0).toLocaleString();
  let tc=C.muted;
  if(prev!=null&&prev>0){const up=value>prev;tc=(invert?!up:up)?C.green:C.red}
  return <div style={{background:C.alt,border:`1px solid ${C.border}`,borderRadius:10,padding:'14px 18px',flex:1,minWidth:115}}>
    <div style={{fontSize:10,color:C.muted,fontWeight:650,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:6}}>{label}</div>
    <div style={{fontSize:22,fontWeight:700,letterSpacing:'-0.02em'}}>{fmt(value)}</div>
    {prev!=null&&<div style={{marginTop:5,fontSize:11,color:tc,fontWeight:600}}>vs {fmt(prev)} prev</div>}
  </div>;
}

function ScopeBar({current,goal}){
  const pct=goal>0?Math.min(Math.max((current/goal)*100,0),150):0;
  const display=Math.min(pct,100);const color=pct>=90?C.green:pct>=60?C.yellow:C.red;const over=pct>100;
  return <div>
    <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:C.sub,marginBottom:4}}>
      <span>{current}/{goal} videos</span><span style={{color:over?C.green:color,fontWeight:600}}>{over?`${pct.toFixed(0)}% ✓`:`${pct.toFixed(0)}%`}</span>
    </div>
    <div style={{height:6,background:C.border,borderRadius:3,overflow:'hidden'}}>
      <div style={{height:'100%',width:`${display}%`,background:color,borderRadius:3,transition:'width 0.4s ease'}}/>
    </div>
  </div>;
}

const Card=({children,style:sx,glow,onClick,hoverable})=>{
  const[h,setH]=useState(false);
  return <div onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{background:glow?C.accentGlow:C.surface,border:`1px solid ${glow?C.accentMed:h&&hoverable?C.accentMed:C.border}`,borderRadius:12,padding:24,cursor:onClick?'pointer':'default',transition:'all 0.2s',...sx}}>{children}</div>;
};
const Btn=({children,onClick,disabled,variant='primary',sx})=><button onClick={disabled?undefined:onClick} style={{border:variant==='outline'?`1px solid ${C.accent}40`:'none',background:variant==='primary'?C.accent:'transparent',color:variant==='primary'?C.bg:variant==='outline'?C.accent:C.sub,borderRadius:8,padding:variant==='ghost'?'8px 12px':'10px 20px',fontWeight:600,fontSize:13,cursor:disabled?'default':'pointer',fontFamily:F.body,opacity:disabled?0.35:1,transition:'all 0.15s',...sx}}>{children}</button>;
const Label=({children})=><div style={{fontSize:10,fontWeight:700,color:C.sub,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:6}}>{children}</div>;
const SH=({children,color:cl})=><div style={{fontSize:10.5,fontWeight:700,color:cl||C.accent,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:16}}>{children}</div>;
const Inp=(props)=><input {...props} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',color:C.text,fontSize:13,fontFamily:F.body,outline:'none',boxSizing:'border-box',...props.style}}/>;
const Txa=(props)=><textarea {...props} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'12px 14px',color:C.text,fontSize:13,fontFamily:F.body,outline:'none',resize:'vertical',minHeight:90,boxSizing:'border-box',lineHeight:1.6,...props.style}}/>;
const Div=()=><div style={{height:1,background:C.border,margin:'20px 0'}}/>;
const Sel=({value,onChange,children})=><select value={value} onChange={onChange} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',color:C.text,fontSize:13,fontFamily:F.body,cursor:'pointer'}}>{children}</select>;

// ═══════════════════════════════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[users,setUsers]=useState([]);
  const[clients,setClients]=useState([]);
  const[scopeData,setScopeData]=useState({});
  const[contentMetrics,setCM]=useState([]);
  const[adMetrics,setAM]=useState([]);
  const[topPerformers,setTP]=useState([]);
  const[analyses,setAn]=useState([]);
  const[fbMap,setFb]=useState({});
  const[view,setView]=useState('dashboard');
  const[selEntry,setSelEntry]=useState(null);
  const[selAnalysis,setSelAnalysis]=useState(null);
  const[aiLoading,setAiLoading]=useState(false);
  const[aiResult,setAiResult]=useState(null);
  const[extracting,setExtracting]=useState(false);
  const[extractedData,setExtractedData]=useState(null);
  const[sheetRefreshing,setSheetRefreshing]=useState(false);
  const[loading,setLoading]=useState(true);

  // ─── Load Data ──────────────────────────────────────────────────────
  const loadData=useCallback(async()=>{
    setLoading(true);
    try{
      const[uR,cR,sR,cmR,amR,tpR,anR,fbR]=await Promise.all([
        sb.from('users').select('*'),
        sb.from('clients').select('*'),
        sb.from('scope_data').select('*').order('refreshed_at',{ascending:false}),
        sb.from('content_metrics').select('*').order('created_at',{ascending:false}),
        sb.from('ad_metrics').select('*').order('created_at',{ascending:false}),
        sb.from('top_performers').select('*').order('created_at',{ascending:false}),
        sb.from('analyses').select('*').order('created_at',{ascending:false}),
        sb.from('feedback').select('*'),
      ]);
      if(uR.data)setUsers(uR.data);
      if(cR.data)setClients(cR.data);
      if(sR.data){const m={};sR.data.forEach(r=>{if(!m[r.client_id])m[r.client_id]=r});setScopeData(m)}
      if(cmR.data)setCM(cmR.data.map(r=>({id:r.id,clientId:r.client_id,period:r.period,date:r.created_at,videosPosted:r.videos_posted,totalViews:r.total_views,engagementRate:r.engagement_rate,likes:r.likes,comments:r.comments,shares:r.shares,avgViews:r.avg_views,topVideoViews:r.top_video_views,topNotes:r.top_notes,bottomNotes:r.bottom_notes})));
      if(amR.data)setAM(amR.data.map(r=>({id:r.id,clientId:r.client_id,period:r.period,date:r.created_at,adSpend:r.ad_spend,impressions:r.impressions,clicks:r.clicks,ctr:r.ctr,cpa:r.cpa,conversions:r.conversions,cpm:r.cpm,roas:r.roas,adNotes:r.ad_notes})));
      if(tpR.data)setTP(tpR.data.map(r=>({id:r.id,clientId:r.client_id,type:r.type,title:r.title,tiktokLink:r.tiktok_link,adLink:r.ad_link,notes:r.notes,fileName:r.file_name,fileUrl:r.file_url,date:r.created_at})));
      if(anR.data)setAn(anR.data.map(r=>({id:r.id,entryId:r.entry_id,clientId:r.client_id,pmId:r.pm_id,snapshot:r.snapshot,questions:r.questions,answers:r.answers,actionItem:r.action_item,status:r.status,date:r.created_at})));
      if(fbR.data){const m={};fbR.data.forEach(r=>{m[r.analysis_id]={adminId:r.admin_id,comment:r.comment,date:r.created_at}});setFb(m)}
    }catch(e){console.error('Load failed:',e)}
    setLoading(false);
  },[]);
  useEffect(()=>{loadData()},[loadData]);

  const isAdmin=user?.role==='admin';const isAds=user?.role==='ads';const isPM=user?.role==='pm';
  const myClients=isAdmin||isAds?clients:clients.filter(cl=>cl.assigned_pm===user?.id);
  const getPM=(pid)=>users.find(u=>u.id===pid);
  const nav=(v)=>{setView(v);setSelEntry(null);setSelAnalysis(null);setAiResult(null);setExtractedData(null)};
  const getCD=(cid)=>{const cm=contentMetrics.filter(e=>e.clientId===cid).sort((a,b)=>new Date(b.date)-new Date(a.date));const am=adMetrics.filter(e=>e.clientId===cid).sort((a,b)=>new Date(b.date)-new Date(a.date));return{latest:cm[0],prev:cm[1],latestAd:am[0],prevAd:am[1]}};
  const getAn=(eid)=>analyses.find(a=>a.entryId===eid);
  const getTP=(cid)=>topPerformers.filter(tp=>tp.clientId===cid);
  const pendingReviews=isAdmin?analyses.filter(a=>a.status==='submitted'):[];
  const awaiting=isPM?contentMetrics.filter(e=>{const cl=clients.find(cc=>cc.id===e.clientId);return cl?.assigned_pm===user?.id&&!getAn(e.id)}):[];

  // ─── Sheet Refresh ────────────────────────────────────────────────
  async function refreshSheet(){
    setSheetRefreshing(true);
    try{
      const res=await fetch('/.netlify/functions/refresh-sheet');const data=await res.json();
      if(data.success&&data.data){const m={};data.data.forEach(r=>{m[r.client_id]=r});setScopeData(m)}
    }catch(e){console.error('Sheet refresh failed:',e)}
    setSheetRefreshing(false);
  }

  // ─── Claude API ───────────────────────────────────────────────────
  async function callClaude(messages){
    const res=await fetch('/.netlify/functions/claude-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,max_tokens:1000})});
    return await res.json();
  }

  async function extractFromScreenshot(file,type){
    setExtracting(true);setExtractedData(null);
    try{
      const base64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej();r.readAsDataURL(file)});
      const prompt=type==='content'?'Extract metrics from this Growi dashboard screenshot. Return ONLY JSON: {"videosPosted":0,"totalViews":0,"engagementRate":0,"likes":0,"comments":0,"shares":0,"avgViews":0,"topVideoViews":0,"notes":""}':'Extract ad metrics from this TikTok Ads Manager screenshot. Return ONLY JSON: {"adSpend":0,"impressions":0,"clicks":0,"ctr":0,"cpa":0,"conversions":0,"cpm":0,"roas":0,"notes":""}';
      const data=await callClaude([{role:'user',content:[{type:'image',source:{type:'base64',media_type:file.type||'image/png',data:base64}},{type:'text',text:prompt}]}]);
      const txt=data.content?.map(i=>i.text||'').join('')||'';
      setExtractedData(JSON.parse(txt.replace(/```json|```/g,'').trim()));
    }catch(e){
      console.error('Extract:',e);
      setExtractedData(type==='content'?{videosPosted:0,totalViews:0,engagementRate:0,likes:0,comments:0,shares:0,avgViews:0,topVideoViews:0,notes:'Could not extract — enter manually'}:{adSpend:0,impressions:0,clicks:0,ctr:0,cpa:0,conversions:0,cpm:0,roas:0,notes:'Could not extract — enter manually'});
    }
    setExtracting(false);
  }

  async function genDiagnostics(client,entry,prev,adData,prevAd,scope){
    setAiLoading(true);setAiResult(null);
    try{
      const prompt=`You are an expert TikTok UGC strategist for BW Club. Force the PM to think strategically.\n\nCLIENT: ${client.name} | ${client.industry||'N/A'}\n${scope?`SCOPE: ${scope.live_posts}/${scope.scope_goal} (${scope.progress}%) | ${scope.videos_left>0?scope.videos_left+' left':Math.abs(scope.videos_left)+' over'} | ${scope.scope_start}→${scope.scope_end}\n${scope.scope_notes?'Notes: '+scope.scope_notes:''}\n${scope.standup_notes?'Standup: '+scope.standup_notes:''}`:''}\nCONTENT: Videos:${entry.videosPosted} Views:${entry.totalViews} Eng:${entry.engagementRate}% AvgViews:${entry.avgViews}\n${prev?`PREV: Videos:${prev.videosPosted} Views:${prev.totalViews} Eng:${prev.engagementRate}%`:''}\n${adData?`ADS: Spend:$${adData.adSpend} CPA:$${adData.cpa} Conv:${adData.conversions} CTR:${adData.ctr}%`:''}\n${entry.topNotes?`Top: ${entry.topNotes}`:''} ${entry.bottomNotes?`Bottom: ${entry.bottomNotes}`:''}\n\nGenerate 4 diagnostic questions referencing specific numbers, connecting creative to outcomes, factoring scope pacing, pushing toward action. Plus 2-3 sentence snapshot.\nJSON only: {"snapshot":"...","questions":["...","...","...","..."]}`;
      const data=await callClaude([{role:'user',content:prompt}]);
      const txt=data.content?.map(i=>i.text||'').join('')||'';
      setAiResult(JSON.parse(txt.replace(/```json|```/g,'').trim()));
    }catch{setAiResult({snapshot:'Unable to generate AI analysis.',questions:['What content changes affected performance?','Which creator drove strongest results?','How does pacing affect strategy?','What would you change next period?']})}
    setAiLoading(false);
  }

  // ─── Supabase Writes ──────────────────────────────────────────────
  async function submitCM(data){const id=`cm_${Date.now()}`;await sb.from('content_metrics').insert({id,client_id:data.clientId,period:data.period,videos_posted:data.videosPosted,total_views:data.totalViews,engagement_rate:data.engagementRate,likes:data.likes,comments:data.comments,shares:data.shares,avg_views:data.avgViews,top_video_views:data.topVideoViews,top_notes:data.topNotes,bottom_notes:data.bottomNotes,submitted_by:user.id});setCM(p=>[{...data,id,date:new Date().toISOString()},...p]);return id}
  async function submitAM(data){const id=`am_${Date.now()}`;await sb.from('ad_metrics').insert({id,client_id:data.clientId,period:data.period,ad_spend:data.adSpend,impressions:data.impressions,clicks:data.clicks,ctr:data.ctr,cpa:data.cpa,conversions:data.conversions,cpm:data.cpm,roas:data.roas,ad_notes:data.adNotes,submitted_by:user.id});setAM(p=>[{...data,id,date:new Date().toISOString()},...p])}
  async function submitTPF(data){const id=`tp_${Date.now()}`;await sb.from('top_performers').insert({id,client_id:data.clientId,type:data.type,title:data.title,tiktok_link:data.tiktokLink,ad_link:data.adLink,notes:data.notes,file_name:data.fileName,file_url:'',submitted_by:user.id});setTP(p=>[{...data,id,date:new Date().toISOString()},...p])}
  async function submitAnaly(data){const id=`a_${Date.now()}`;await sb.from('analyses').insert({id,entry_id:data.entryId,client_id:data.clientId,pm_id:user.id,snapshot:data.snapshot,questions:data.questions,answers:data.answers,action_item:data.actionItem,status:'submitted'});setAn(p=>[{...data,id,pmId:user.id,status:'submitted',date:new Date().toISOString()},...p])}
  async function submitFB(aId,comment){await sb.from('feedback').insert({analysis_id:aId,admin_id:user.id,comment});await sb.from('analyses').update({status:'reviewed'}).eq('id',aId);setFb(p=>({...p,[aId]:{adminId:user.id,comment,date:new Date().toISOString()}}));setAn(p=>p.map(a=>a.id===aId?{...a,status:'reviewed'}:a))}

  // ═══════════════════════════════════════════════════════════════════
  // LOADING
  if(loading)return <div style={{fontFamily:F.body,background:C.bg,color:C.text,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{textAlign:'center'}}><div style={{fontSize:20,animation:'spin 1s linear infinite',marginBottom:12}}>⟳</div><div style={{color:C.sub}}>Loading portal...</div></div></div>;

  // LOGIN
  if(!user)return(
    <div style={{fontFamily:F.body,background:C.bg,color:C.text,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:48}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:12,fontWeight:700,color:C.accent,letterSpacing:'0.18em',textTransform:'uppercase',marginBottom:14}}>BW Club</div>
        <h1 style={{fontFamily:F.display,fontSize:38,fontWeight:600,margin:0}}>PM Agency Portal</h1>
        <p style={{color:C.sub,marginTop:10}}>Select your profile to continue</p>
      </div>
      <div style={{display:'flex',gap:14,flexWrap:'wrap',justifyContent:'center',maxWidth:700}}>
        {users.map(u=><div key={u.id} onClick={()=>{setUser(u);setView('dashboard')}} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'24px',cursor:'pointer',textAlign:'center',minWidth:110,transition:'all 0.2s'}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          <div style={{width:42,height:42,borderRadius:'50%',background:u.role==='admin'?C.accentDim:u.role==='ads'?C.orangeDim:C.blueDim,color:u.role==='admin'?C.accent:u.role==='ads'?C.orange:C.blue,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,margin:'0 auto 10px'}}>{u.avatar}</div>
          <div style={{fontWeight:600,fontSize:13}}>{u.name}</div>
          <div style={{fontSize:10,color:C.muted,marginTop:3,textTransform:'uppercase'}}>{u.title}</div>
        </div>)}
      </div>
    </div>
  );

  // ═══════════════════════════════════════════════════════════════════
  // CONTENT UPLOAD
  function ContentUploadView(){
    const[cid,setCid]=useState('');const[period,setPeriod]=useState('mon');const[ss,setSS]=useState(null);const[preview,setPrev]=useState(null);
    const[topN,setTopN]=useState('');const[botN,setBotN]=useState('');const[ov,setOv]=useState({});const fRef=useRef();
    const gv=(k)=>ov[k]!==undefined?ov[k]:(extractedData?.[k]??'');
    const submit=async()=>{if(!cid)return;await submitCM({clientId:cid,period,videosPosted:parseFloat(gv('videosPosted'))||0,totalViews:parseFloat(gv('totalViews'))||0,engagementRate:parseFloat(gv('engagementRate'))||0,likes:parseFloat(gv('likes'))||0,comments:parseFloat(gv('comments'))||0,shares:parseFloat(gv('shares'))||0,avgViews:parseFloat(gv('avgViews'))||0,topVideoViews:parseFloat(gv('topVideoViews'))||0,topNotes:topN,bottomNotes:botN});nav('dashboard')};
    return <div style={{maxWidth:760}}>
      <Btn variant='ghost' onClick={()=>nav('dashboard')}>← Back</Btn>
      <h1 style={{fontFamily:F.display,fontSize:28,fontWeight:600,margin:'20px 0 4px'}}>Upload Content Metrics</h1>
      <p style={{color:C.sub,marginBottom:28}}>Screenshot Growi → Claude extracts → confirm & submit.</p>
      <Card>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div><Label>Client</Label><Sel value={cid} onChange={e=>setCid(e.target.value)}><option value=''>Select...</option>{clients.map(cl=><option key={cl.id} value={cl.id}>{cl.name}</option>)}</Sel></div>
          <div><Label>Period</Label><Sel value={period} onChange={e=>setPeriod(e.target.value)}><option value='mon'>Monday (Weekend)</option><option value='thu'>Thursday (EOW)</option></Sel></div>
        </div>
        <Div/>
        <Label>Growi Screenshot</Label>
        <div onClick={()=>fRef.current?.click()} style={{background:C.bg,border:`2px dashed ${C.border}`,borderRadius:10,padding:preview?'12px':'32px 20px',textAlign:'center',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          {preview?<img src={preview} style={{maxWidth:'100%',maxHeight:250,borderRadius:8}}/>:<div style={{color:C.muted}}>Click to upload screenshot</div>}
          <input ref={fRef} type='file' accept='image/*' style={{display:'none'}} onChange={e=>{const f=e.target.files[0];if(f){setSS(f);setPrev(URL.createObjectURL(f));setExtractedData(null)}}}/>
        </div>
        {ss&&!extractedData&&!extracting&&<div style={{marginTop:14,textAlign:'center'}}><Btn onClick={()=>extractFromScreenshot(ss,'content')}>Extract with Claude</Btn></div>}
        {extracting&&<div style={{marginTop:14,textAlign:'center',color:C.sub}}><span style={{display:'inline-block',animation:'spin 1s linear infinite'}}>⟳</span> Reading screenshot...</div>}
        {(extractedData||!ss)&&<><Div/>{extractedData&&<div style={{marginBottom:16,padding:'10px 14px',background:C.accentGlow,borderRadius:8,border:`1px solid ${C.accentMed}`,fontSize:12,color:C.accent}}>✓ Extracted — review and adjust</div>}<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:12}}>{[['videosPosted','Videos'],['totalViews','Views'],['engagementRate','Eng %'],['likes','Likes'],['comments','Comments'],['shares','Shares'],['avgViews','Avg Views'],['topVideoViews','Top Video']].map(([k,l])=><div key={k}><Label>{l}</Label><Inp type='number' value={gv(k)} onChange={e=>setOv(p=>({...p,[k]:e.target.value}))} placeholder='0'/></div>)}</div></>}
        <Div/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>

      </div>
      <nav style={{padding:'12px 8px',flex:1}}>
        {sidebarItems.map(item=><div key={item.id} onClick={()=>nav(item.id)} style={{padding:'9px 12px',borderRadius:8,cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:2,fontSize:13,fontWeight:view===item.id?600:400,color:view===item.id?C.text:C.sub,background:view===item.id?C.hover:'transparent',transition:'all 0.15s'}} onMouseEnter={e=>{if(view!==item.id)e.currentTarget.style.background=C.hover}} onMouseLeave={e=>{if(view!==item.id)e.currentTarget.style.background='transparent'}}>
          <span style={{fontSize:12,width:16,textAlign:'center'}}>{item.icon}</span>{item.label}
          {item.id==='dashboard'&&isPM&&awaiting.length>0&&<span style={{marginLeft:'auto',background:C.accent,color:C.bg,fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10}}>{awaiting.length}</span>}
          {item.id==='dashboard'&&isAdmin&&pendingReviews.length>0&&<span style={{marginLeft:'auto',background:C.yellow,color:C.bg,fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10}}>{pendingReviews.length}</span>}
        </div>)}
      </nav>
      <div style={{padding:'12px',borderTop:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:isAdmin?C.accentDim:isAds?C.orangeDim:C.blueDim,color:isAdmin?C.accent:isAds?C.orange:C.blue,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{user.avatar}</div>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{user.name}</div><div style={{fontSize:10,color:C.muted}}>{user.title}</div></div>
        <Btn variant='ghost' onClick={()=>{setUser(null);nav('dashboard')}} sx={{padding:'4px 8px',fontSize:10}}>Switch</Btn>
      </div>
    </div>
    <div style={{marginLeft:240,minHeight:'100vh',padding:'28px 36px'}}>
      {view==='dashboard'&&<DashboardView/>}
      {view==='contentUpload'&&isAdmin&&<ContentUploadView/>}
      {view==='adsUpload'&&(isAdmin||isAds)&&<AdsUploadView/>}
      {view==='topPerformers'&&isAdmin&&<TopPerfView/>}
      {view==='pmAnalysis'&&isPM&&<PMAnalysisView/>}
      {view==='adminReview'&&isAdmin&&<AdminReviewView/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
