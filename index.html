// ─── THEME ──────────────────────────────────────────────────────────
const C={
  bg:'#0B0C10',surface:'#14151B',alt:'#1A1B23',hover:'#1E1F28',border:'#262733',
  accent:'#C9A84C',accentDim:'#C9A84C20',accentGlow:'#C9A84C10',accentMed:'#C9A84C50',

  green:'#4ADE80',greenDim:'#4ADE8015',greenSoft:'#4ADE8030',
  red:'#F87171',redDim:'#F8717115',redSoft:'#F8717130',
  yellow:'#FBBF24',yellowDim:'#FBBF2415',yellowSoft:'#FBBF2430',

// ─── UI ─────────────────────────────────────────────────────────────
const Badge=({label,color,bg})=><span style={{display:'inline-flex',padding:'3px 10px',borderRadius:20,fontSize:10.5,fontWeight:650,color,background:bg,letterSpacing:'0.03em'}}>{label}</span>;
const Card=({children,style:sx,onClick,hoverable,health})=>{
  const[h,setH]=useState(false);
  const bdr=health==='green'?C.greenSoft:health==='yellow'?C.yellowSoft:health==='red'?C.redSoft:h&&hoverable?C.accentMed:C.border;
  return<div onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{background:C.surface,border:`1px solid ${bdr}`,borderRadius:12,padding:20,cursor:onClick?'pointer':'default',transition:'all 0.2s',animation:'fadeIn 0.3s ease',...sx}}>{children}</div>;
};
const Btn=({children,onClick,disabled,variant='primary',sx})=><button onClick={disabled?undefined:onClick} style={{border:variant==='outline'?`1px solid ${C.accent}40`:variant==='danger'?`1px solid ${C.red}40`:'none',background:variant==='primary'?C.accent:variant==='danger'?'transparent':'transparent',color:variant==='primary'?C.bg:variant==='danger'?C.red:variant==='outline'?C.accent:C.sub,borderRadius:8,padding:variant==='ghost'?'8px 12px':'10px 20px',fontWeight:600,fontSize:13,cursor:disabled?'default':'pointer',fontFamily:F.body,opacity:disabled?0.35:1,transition:'all 0.15s',...sx}}>{children}</button>;
const Label=({children})=><div style={{fontSize:10,fontWeight:700,color:C.sub,textTransform:'uppercase',letterSpacing:'0.07em',marginBottom:6}}>{children}</div>;
const SH=({children,color:cl,right})=><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}><div style={{fontSize:10.5,fontWeight:700,color:cl||C.accent,textTransform:'uppercase',letterSpacing:'0.08em'}}>{children}</div>{right}</div>;
const Inp=(props)=><input {...props} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',color:C.text,fontSize:13,fontFamily:F.body,outline:'none',boxSizing:'border-box',...props.style}}/>;
const Txa=(props)=><textarea {...props} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'12px 14px',color:C.text,fontSize:13,fontFamily:F.body,outline:'none',resize:'vertical',minHeight:70,boxSizing:'border-box',lineHeight:1.6,...props.style}}/>;
const Dv=()=><div style={{height:1,background:C.border,margin:'20px 0'}}/>;
const Sel=({value,onChange,children,style:sx})=><select value={value} onChange={onChange} style={{width:'100%',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',color:C.text,fontSize:13,fontFamily:F.body,cursor:'pointer',...sx}}>{children}</select>;

function Trend({current,previous,format,invert}){
  if(previous==null||previous===0)return<span style={{color:C.muted,fontSize:11}}>—</span>;
  const pctChange=((current-previous)/previous)*100;
  const up=pctChange>0;const flat=Math.abs(pctChange)<2;
  const color=flat?C.muted:(invert?!up:up)?C.green:C.red;
  const arrow=flat?'→':up?'↑':'↓';
  const fmt=format==='$'?`$${current.toFixed(2)}`:format==='%'?`${current}%`:current>=1000000?(current/1000000).toFixed(1)+'M':current>=1000?(current/1000).toFixed(1)+'K':current.toLocaleString();
  return<div><span style={{fontSize:18,fontWeight:700,letterSpacing:'-0.02em'}}>{fmt}</span><span style={{fontSize:12,fontWeight:600,color,marginLeft:6}}>{arrow} {Math.abs(pctChange).toFixed(0)}%</span></div>;
}

function HealthDot({status,size=10}){
  const color=status==='green'?C.green:status==='yellow'?C.yellow:status==='red'?C.red:C.muted;
  return<div style={{width:size,height:size,borderRadius:'50%',background:color,boxShadow:`0 0 ${size}px ${color}40`,flexShrink:0}}/>;
}

// ─── HEALTH CALC ────────────────────────────────────────────────────
function calcHealth(client,checkins,creatorCheckins,creators){
  const clientCheckins=checkins.filter(c=>c.client_id===client.id).sort((a,b)=>new Date(b.checkin_date)-new Date(a.checkin_date));
  const clientCreators=creators.filter(c=>c.client_id===client.id&&c.status==='active');
  
  // No data at all
  if(clientCheckins.length===0)return{status:'grey',reason:'No data yet',score:0};
  
  const latest=clientCheckins[0];const prev=clientCheckins[1];
  const now=new Date();const lastDate=new Date(latest.checkin_date);
  const daysSince=Math.floor((now-lastDate)/(1000*60*60*24));
  
  let issues=[];let score=100;
  
  // Freshness
  if(daysSince>4){issues.push('No check-in in '+daysSince+' days');score-=40}
  else if(daysSince>2){issues.push('Check-in '+daysSince+'d ago');score-=15}
  
  // View trend
  if(prev){
    const viewChange=prev.views_48h>0?((latest.views_48h-prev.views_48h)/prev.views_48h)*100:-100;
    if(viewChange<-30){issues.push('Views dropped '+Math.abs(viewChange).toFixed(0)+'%');score-=30}
    else if(viewChange<-15){issues.push('Views dipped');score-=15}
    else if(viewChange>15)score+=5;
    
    const likeChange=prev.likes_48h>0?((latest.likes_48h-prev.likes_48h)/prev.likes_48h)*100:-100;
    if(likeChange<-30){issues.push('Likes dropped');score-=20}
    else if(likeChange<-15)score-=10;
  }
  
  // Creator health
  if(clientCreators.length>0){
    const latestCreatorCheckins=clientCreators.map(cr=>{
      const cc=creatorCheckins.filter(c=>c.creator_id===cr.id).sort((a,b)=>new Date(b.checkin_date)-new Date(a.checkin_date));
      return{creator:cr,latest:cc[0],prev:cc[1]};
    });
    const noData=latestCreatorCheckins.filter(c=>!c.latest).length;
    if(noData>0){issues.push(noData+' creator'+(noData>1?'s':'')+' unchecked');score-=10*noData}
    
    latestCreatorCheckins.forEach(({creator,latest:cl,prev:cp})=>{
      if(cl&&cp&&cp.follower_count>0){
        const fChange=((cl.follower_count-cp.follower_count)/cp.follower_count)*100;
        if(fChange<-5){issues.push(creator.name+' lost followers');score-=15}
      }
    });
  }
  
  score=Math.max(0,Math.min(100,score));
  const status=score>=70?'green':score>=40?'yellow':'red';
  return{status,reason:issues.length>0?issues[0]:'Looking good',issues,score,latest,prev,daysSince};
}

// ═══════════════════════════════════════════════════════════════════
function App(){
  const[user,setUser]=useState(null);
  const[users,setUsers]=useState([]);
  const[clients,setClients]=useState([]);
  const[creators,setCreators]=useState([]);
  const[clientCheckins,setCC]=useState([]);
  const[creatorCheckins,setCrC]=useState([]);
  const[scopeData,setScopeData]=useState({});
  const[view,setView]=useState('dashboard');
  const[selClient,setSelClient]=useState(null);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);
  const[sheetRefreshing,setSR]=useState(false);

  const loadData=useCallback(async()=>{
    setLoading(true);
    try{
      const[uR,cR,crR,ccR,crcR,sR]=await Promise.all([
        sb.from('users').select('*'),
        sb.from('clients').select('*'),
        sb.from('creators').select('*').order('created_at',{ascending:true}),
        sb.from('client_checkins').select('*').order('checkin_date',{ascending:false}),
        sb.from('creator_checkins').select('*').order('checkin_date',{ascending:false}),
        sb.from('scope_data').select('*').order('refreshed_at',{ascending:false}),
      ]);
      if(uR.data){
        const allowed=uR.data.filter(u=>['admin2','pm1','pm2','pm3','pm4'].includes(u.id));
        setUsers(allowed.map(u=>u.role==='admin'?{...u,name:'Admin',avatar:'★',title:'Leadership'}:u));
      }
      if(cR.data)setClients(cR.data);
      if(crR.data)setCreators(crR.data);
      if(ccR.data)setCC(ccR.data);
      if(crcR.data)setCrC(crcR.data);
      if(sR.data){const m={};sR.data.forEach(r=>{if(!m[r.client_id])m[r.client_id]=r});setScopeData(m)}
    }catch(e){console.error(e)}
    setLoading(false);
  },[]);
  useEffect(()=>{loadData()},[loadData]);

  const isAdmin=user?.role==='admin';
  const isPM=user?.role==='pm';
  const myClients=isAdmin?clients:clients.filter(cl=>cl.assigned_pm===user?.id);
  const getPM=pid=>users.find(u=>u.id===pid);
  const nav=v=>{setView(v);setSelClient(null)};
  const today=new Date().toISOString().split('T')[0];

  // Check if PM already submitted today for a client
  const hasCheckedIn=(clientId)=>clientCheckins.some(c=>c.client_id===clientId&&c.checkin_date===today&&c.pm_id===user?.id);

  async function refreshSheet(){
    setSR(true);
    try{const res=await fetch('/.netlify/functions/refresh-sheet');const data=await res.json();
      if(data.success&&data.data){const m={};data.data.forEach(r=>{m[r.client_id]=r});setScopeData(m)}}catch(e){}
    setSR(false);
  }

  // ═══════════════════════════════════════════════════════════════════
  if(loading)return<div style={{fontFamily:F.body,background:C.bg,color:C.text,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{textAlign:'center'}}><div style={{fontSize:20,animation:'spin 1s linear infinite',marginBottom:12}}>⟳</div><div style={{color:C.sub}}>Loading Command Center...</div></div></div>;

  // LOGIN
  if(!user)return(
    <div style={{fontFamily:F.body,background:C.bg,color:C.text,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:48}}>
      <div style={{textAlign:'center'}}>
        <div style={{fontSize:12,fontWeight:700,color:C.accent,letterSpacing:'0.18em',textTransform:'uppercase',marginBottom:14}}>BW Club</div>
        <h1 style={{fontFamily:F.display,fontSize:38,fontWeight:600,margin:0}}>Command Center</h1>
        <p style={{color:C.sub,marginTop:10}}>Select your profile</p>
      </div>
      <div style={{display:'flex',gap:14,flexWrap:'wrap',justifyContent:'center',maxWidth:600}}>
        {users.sort((a,b)=>a.role==='admin'?-1:b.role==='admin'?1:0).map(u=><div key={u.id} onClick={()=>{setUser(u);setView('dashboard')}} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'24px',cursor:'pointer',textAlign:'center',minWidth:110,transition:'all 0.2s'}} onMouseEnter={e=>e.currentTarget.style.borderColor=C.accent} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
          <div style={{width:42,height:42,borderRadius:'50%',background:u.role==='admin'?C.accentDim:C.blueDim,color:u.role==='admin'?C.accent:C.blue,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,fontWeight:700,margin:'0 auto 10px'}}>{u.avatar}</div>
          <div style={{fontWeight:600,fontSize:13}}>{u.name}</div>
          <div style={{fontSize:10,color:C.muted,marginTop:3,textTransform:'uppercase'}}>{u.title}</div>
        </div>)}
      </div>
    </div>
  );

  // ═══════════════════════════════════════════════════════════════════
  // PM CHECK-IN FORM
  // ═══════════════════════════════════════════════════════════════════
  function CheckinView(){
    const client=selClient;
    const clientCreators=creators.filter(c=>c.client_id===client?.id&&c.status==='active');
    const alreadyDone=hasCheckedIn(client?.id);
    const[views,setViews]=useState('');
    const[likes,setLikes]=useState('');
    const[topUrl,setTopUrl]=useState('');
    const[topNotes,setTopNotes]=useState('');
    const[crData,setCrData]=useState(()=>{
      const m={};clientCreators.forEach(cr=>{m[cr.id]={followers:'',views:'',likes:''}});return m;
    });
    const[done,setDone]=useState(false);

    useEffect(()=>{
      const m={};clientCreators.forEach(cr=>{m[cr.id]={followers:'',views:'',likes:''}});setCrData(m);
    },[client?.id]);

    const setCr=(id,key,val)=>setCrData(p=>({...p,[id]:{...p[id],[key]:val}}));

    const submit=async()=>{
      if(!client)return;
      setSaving(true);
      // Client checkin
      const ccId=`cc_${Date.now()}`;
      const ccRow={id:ccId,client_id:client.id,pm_id:user.id,views_48h:parseInt(views)||0,likes_48h:parseInt(likes)||0,top_video_url:topUrl,top_video_notes:topNotes,checkin_date:today};
      await sb.from('client_checkins').insert(ccRow);
      setCC(p=>[ccRow,...p]);

      // Creator checkins
      for(const cr of clientCreators){
        const d=crData[cr.id];
        if(d&&(d.followers||d.views||d.likes)){
          const crId=`crc_${Date.now()}_${cr.id}`;
          const crRow={id:crId,creator_id:cr.id,client_id:client.id,pm_id:user.id,follower_count:parseInt(d.followers)||0,views:parseInt(d.views)||0,likes:parseInt(d.likes)||0,checkin_date:today};
          await sb.from('creator_checkins').insert(crRow);
          setCrC(p=>[crRow,...p]);
        }
      }
      setSaving(false);setDone(true);
    };

    if(!client)return null;

    if(done||alreadyDone)return<div style={{maxWidth:500,margin:'80px auto',textAlign:'center'}}>
      <div style={{width:64,height:64,borderRadius:'50%',background:C.greenDim,color:C.green,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,margin:'0 auto 20px'}}>✓</div>
      <h2 style={{fontFamily:F.display,fontSize:24,fontWeight:600,marginBottom:8}}>{client.name} — Checked In</h2>
      <p style={{color:C.sub,marginBottom:24}}>{alreadyDone&&!done?'Already submitted today.':'Data saved.'}</p>
      <div style={{display:'flex',gap:10,justifyContent:'center'}}>
        <Btn onClick={()=>nav('dashboard')}>Dashboard</Btn>
        <Btn variant='outline' onClick={()=>{const idx=myClients.findIndex(c=>c.id===client.id);const next=myClients[idx+1];if(next){setSelClient(next);setDone(false);setViews('');setLikes('');setTopUrl('');setTopNotes('')}else nav('dashboard')}}>Next Client →</Btn>
      </div>
    </div>;

    return<div style={{maxWidth:720}}>
      <Btn variant='ghost' onClick={()=>nav('dashboard')}>← Back</Btn>
      <h1 style={{fontFamily:F.display,fontSize:28,fontWeight:600,margin:'20px 0 4px'}}>{client.name} — Check-In</h1>
      <p style={{color:C.sub,marginBottom:24}}>48-hour performance snapshot · {new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}</p>

      <Card style={{marginBottom:16}}>
        <SH>Client Performance — Last 48 Hours</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}}>
          <div><Label>Total Views (48h)</Label><Inp type='number' value={views} onChange={e=>setViews(e.target.value)} placeholder='e.g. 125000'/></div>
          <div><Label>Total Likes (48h)</Label><Inp type='number' value={likes} onChange={e=>setLikes(e.target.value)} placeholder='e.g. 8500'/></div>
        </div>
        <Dv/>
        <SH color={C.green}>Top Performing Video</SH>
        <div><Label>TikTok Link</Label><Inp value={topUrl} onChange={e=>setTopUrl(e.target.value)} placeholder='https://tiktok.com/...'/></div>
        <div style={{marginTop:12}}><Label>Why is this one winning?</Label><Txa value={topNotes} onChange={e=>setTopNotes(e.target.value)} placeholder='Hook style, format, pacing, CTA — what made it pop?'/></div>
      </Card>

      {clientCreators.length>0&&<Card style={{marginBottom:16}}>
        <SH color={C.purple}>Creator Health Check</SH>
        <p style={{fontSize:12,color:C.muted,marginBottom:16}}>Quick numbers per creator — follower count + recent performance</p>
        {clientCreators.map((cr,i)=><div key={cr.id}>
          {i>0&&<div style={{height:1,background:C.border,margin:'16px 0'}}/>}
          <div style={{fontSize:14,fontWeight:600,marginBottom:10}}>{cr.name}<span style={{color:C.muted,fontWeight:400,marginLeft:8,fontSize:12}}>@{cr.tiktok_handle||'—'}</span></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
            <div><Label>Followers</Label><Inp type='number' value={crData[cr.id]?.followers||''} onChange={e=>setCr(cr.id,'followers',e.target.value)} placeholder='0'/></div>
            <div><Label>Views (48h)</Label><Inp type='number' value={crData[cr.id]?.views||''} onChange={e=>setCr(cr.id,'views',e.target.value)} placeholder='0'/></div>
            <div><Label>Likes (48h)</Label><Inp type='number' value={crData[cr.id]?.likes||''} onChange={e=>setCr(cr.id,'likes',e.target.value)} placeholder='0'/></div>
          </div>
        </div>)}
      </Card>}

      <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
        <Btn variant='outline' onClick={()=>nav('dashboard')}>Cancel</Btn>
        <Btn disabled={!views&&!likes} onClick={submit} sx={{padding:'12px 32px'}}>{saving?'Saving...':'Submit Check-In'}</Btn>
      </div>
    </div>;
  }

          <span style={{fontSize:13,fontWeight:600,minWidth:70,textAlign:'right'}}>{scope.live_posts}/{scope.scope_goal}</span>
        </div>
      </Card>}

      {/* Latest metrics */}
      {cCheckins.length>0&&<Card style={{marginBottom:14}}>
        <SH>Latest Check-In<span style={{fontWeight:400,color:C.muted,fontSize:11,marginLeft:10}}>{new Date(cCheckins[0].checkin_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
          <div><Label>Views (48h)</Label><Trend current={cCheckins[0].views_48h} previous={cCheckins[1]?.views_48h}/></div>
          <div><Label>Likes (48h)</Label><Trend current={cCheckins[0].likes_48h} previous={cCheckins[1]?.likes_48h}/></div>
        </div>
        {cCheckins[0].top_video_url&&<div style={{marginTop:16,padding:'12px 16px',background:C.alt,borderRadius:8,borderLeft:`3px solid ${C.green}`}}>
          <div style={{fontSize:10,fontWeight:700,color:C.green,textTransform:'uppercase',marginBottom:4}}>Top Video</div>
          <a href={cCheckins[0].top_video_url} target='_blank' rel='noreferrer' style={{color:C.accent,textDecoration:'none',fontSize:13}}>🔗 {cCheckins[0].top_video_url.slice(0,60)}...</a>
          {cCheckins[0].top_video_notes&&<p style={{margin:'6px 0 0',fontSize:13,color:C.sub,lineHeight:1.5}}>{cCheckins[0].top_video_notes}</p>}
        </div>}
      </Card>}

      {/* Creators */}
      {clientCreators.length>0&&<Card style={{marginBottom:14}}>
        <SH color={C.purple}>Creators ({clientCreators.length})</SH>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:12}}>
          {clientCreators.map(cr=>{
            const cc=creatorCheckins.filter(c=>c.creator_id===cr.id).sort((a,b)=>new Date(b.checkin_date)-new Date(a.checkin_date));
            const lat=cc[0];const prev=cc[1];
            const followerDelta=lat&&prev&&prev.follower_count>0?((lat.follower_count-prev.follower_count)/prev.follower_count)*100:null;
            const creatorHealth=!lat?'grey':followerDelta!==null&&followerDelta<-5?'red':followerDelta!==null&&followerDelta<-2?'yellow':'green';
            return<div key={cr.id} style={{background:C.alt,borderRadius:10,padding:'14px 16px',border:`1px solid ${C.border}`}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
                <HealthDot status={creatorHealth} size={8}/>
                <span style={{fontWeight:600,fontSize:13}}>{cr.name}</span>
              </div>
              <div style={{fontSize:11,color:C.muted,marginBottom:6}}>@{cr.tiktok_handle||'—'}</div>
              {lat?<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:4}}>
                <div><div style={{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Followers</div><div style={{fontSize:12,fontWeight:600}}>{lat.follower_count>=1000?(lat.follower_count/1000).toFixed(1)+'K':lat.follower_count}</div></div>
                <div><div style={{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Views</div><div style={{fontSize:12,fontWeight:600}}>{lat.views>=1000?(lat.views/1000).toFixed(1)+'K':lat.views}</div></div>
                <div><div style={{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Likes</div><div style={{fontSize:12,fontWeight:600}}>{lat.likes>=1000?(lat.likes/1000).toFixed(1)+'K':lat.likes}</div></div>
              </div>:<div style={{fontSize:11,color:C.muted,fontStyle:'italic'}}>No data yet</div>}
            </div>;
          })}
        </div>
      </Card>}

      {/* Check-in History */}
      {cCheckins.length>0&&<Card>
        <SH>Check-In History</SH>
        <div style={{display:'grid',gridTemplateColumns:'auto 1fr 1fr 1fr',gap:'8px 16px',fontSize:12}}>
          <div style={{color:C.muted,fontWeight:700,fontSize:10,textTransform:'uppercase'}}>Date</div>
          <div style={{color:C.muted,fontWeight:700,fontSize:10,textTransform:'uppercase'}}>Views 48h</div>
          <div style={{color:C.muted,fontWeight:700,fontSize:10,textTransform:'uppercase'}}>Likes 48h</div>
          <div style={{color:C.muted,fontWeight:700,fontSize:10,textTransform:'uppercase'}}>Top Video</div>
          {cCheckins.slice(0,10).map((c,i)=>{
            const prev=cCheckins[i+1];
            const vColor=!prev?C.text:c.views_48h>=prev.views_48h?C.green:C.red;
            const lColor=!prev?C.text:c.likes_48h>=prev.likes_48h?C.green:C.red;
            return<React.Fragment key={c.id}>
              <div style={{color:C.sub}}>{new Date(c.checkin_date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
              <div style={{color:vColor,fontWeight:600}}>{c.views_48h?.toLocaleString()}</div>
              <div style={{color:lColor,fontWeight:600}}>{c.likes_48h?.toLocaleString()}</div>
              <div>{c.top_video_url?<a href={c.top_video_url} target='_blank' rel='noreferrer' style={{color:C.accent,textDecoration:'none'}}>🔗 Link</a>:<span style={{color:C.muted}}>—</span>}</div>
            </React.Fragment>;
          })}
        </div>
      </Card>}
    </div>;
  }

  // ═══════════════════════════════════════════════════════════════════
  // ADMIN: MANAGE CREATORS
  // ═══════════════════════════════════════════════════════════════════
  function ManageCreatorsView(){
    const[clientId,setClientId]=useState(clients[0]?.id||'');
    const[newName,setNewName]=useState('');
    const[newHandle,setNewHandle]=useState('');
    const clientCreators=creators.filter(c=>c.client_id===clientId);
    const active=clientCreators.filter(c=>c.status==='active');
    const removed=clientCreators.filter(c=>c.status==='removed');

    const addCreator=async()=>{
      if(!newName.trim()||!clientId)return;
      const id=`cr_${Date.now()}`;
      const row={id,name:newName.trim(),tiktok_handle:newHandle.trim().replace('@',''),client_id:clientId,status:'active'};
      await sb.from('creators').insert(row);
      setCreators(p=>[...p,{...row,created_at:new Date().toISOString()}]);
      setNewName('');setNewHandle('');
    };

    const removeCreator=async(id)=>{
      await sb.from('creators').update({status:'removed'}).eq('id',id);
      setCreators(p=>p.map(c=>c.id===id?{...c,status:'removed'}:c));
    };

    const restoreCreator=async(id)=>{
      await sb.from('creators').update({status:'active'}).eq('id',id);
      setCreators(p=>p.map(c=>c.id===id?{...c,status:'active'}:c));
    };

    return<div style={{maxWidth:700}}>
      <Btn variant='ghost' onClick={()=>nav('dashboard')}>← Back</Btn>
      <h1 style={{fontFamily:F.display,fontSize:28,fontWeight:600,margin:'20px 0 4px'}}>Manage Creators</h1>
      <p style={{color:C.sub,marginBottom:24}}>Add creators to clients so PMs can track them.</p>

      <div style={{marginBottom:20}}><Label>Client</Label>
        <Sel value={clientId} onChange={e=>setClientId(e.target.value)}>{clients.map(cl=><option key={cl.id} value={cl.id}>{cl.name} ({creators.filter(c=>c.client_id===cl.id&&c.status==='active').length} creators)</option>)}</Sel>
      </div>

      <Card style={{marginBottom:16}}>
        <SH>Add Creator</SH>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr auto',gap:10,alignItems:'end'}}>
          <div><Label>Name</Label><Inp value={newName} onChange={e=>setNewName(e.target.value)} placeholder='Creator name'/></div>
          <div><Label>TikTok Handle</Label><Inp value={newHandle} onChange={e=>setNewHandle(e.target.value)} placeholder='@handle'/></div>
          <Btn disabled={!newName.trim()} onClick={addCreator} sx={{marginBottom:1}}>Add</Btn>
        </div>
      </Card>

      {active.length>0&&<Card style={{marginBottom:16}}>
        <SH color={C.green}>Active Creators ({active.length})</SH>
        {active.map(cr=><div key={cr.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:`1px solid ${C.border}`}}>
          <div><span style={{fontWeight:600}}>{cr.name}</span><span style={{color:C.muted,marginLeft:8,fontSize:12}}>@{cr.tiktok_handle||'—'}</span></div>
          <Btn variant='danger' onClick={()=>removeCreator(cr.id)} sx={{fontSize:11,padding:'4px 12px'}}>Remove</Btn>
        </div>)}
      </Card>}

      {removed.length>0&&<Card>
        <SH color={C.muted}>Removed ({removed.length})</SH>
        {removed.map(cr=><div key={cr.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:`1px solid ${C.border}`,opacity:0.5}}>
          <div><span>{cr.name}</span><span style={{color:C.muted,marginLeft:8,fontSize:12}}>@{cr.tiktok_handle||'—'}</span></div>
          <Btn variant='ghost' onClick={()=>restoreCreator(cr.id)} sx={{fontSize:11}}>Restore</Btn>
        </div>)}
      </Card>}
    </div>;
  }

  // ═══════════════════════════════════════════════════════════════════
  // DASHBOARD
  // ═══════════════════════════════════════════════════════════════════
  function DashboardView(){
    const healthMap=useMemo(()=>{
      const m={};clients.forEach(cl=>{m[cl.id]=calcHealth(cl,clientCheckins,creatorCheckins,creators)});return m;
    },[clients,clientCheckins,creatorCheckins,creators]);

    const needsCheckin=isPM?myClients.filter(cl=>!hasCheckedIn(cl.id)):[];
    const redClients=clients.filter(cl=>healthMap[cl.id]?.status==='red');
    const yellowClients=clients.filter(cl=>healthMap[cl.id]?.status==='yellow');

    // Sort: red first, yellow, green, grey
    const sorted=[...myClients].sort((a,b)=>{
      const order={red:0,yellow:1,green:2,grey:3};
      return(order[healthMap[a.id]?.status]||3)-(order[healthMap[b.id]?.status]||3);
    });

    return<div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:24}}>
        <div>
          <h1 style={{fontFamily:F.display,fontSize:28,fontWeight:600,margin:0}}>Command Center</h1>
          <p style={{color:C.sub,marginTop:4,fontSize:13}}>
            {isAdmin?`${redClients.length} needs attention · ${yellowClients.length} watch · ${clients.length-redClients.length-yellowClients.length} healthy`
            :isPM&&needsCheckin.length>0?`${needsCheckin.length} client${needsCheckin.length>1?'s':''} need check-in today`
            :'All checked in today ✓'}
          </p>
        </div>
        {isAdmin&&<Btn variant='outline' onClick={refreshSheet} sx={{fontSize:12}}>{sheetRefreshing?'⟳...':'⟳ Refresh Sheet'}</Btn>}
      </div>

      {/* PM: Check-in prompt */}
      {isPM&&needsCheckin.length>0&&<div style={{marginBottom:24}}>
        <SH color={C.accent}>Today's Check-Ins</SH>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          {needsCheckin.map(cl=><Btn key={cl.id} variant='outline' onClick={()=>{setSelClient(cl);setView('checkin')}} sx={{padding:'10px 18px'}}>{cl.name} →</Btn>)}
        </div>
      </div>}

      {/* Summary bar */}
      {isAdmin&&<div style={{display:'flex',gap:12,marginBottom:24}}>
        <div style={{flex:1,background:C.redDim,border:`1px solid ${C.redSoft}`,borderRadius:10,padding:'14px 18px',textAlign:'center'}}>
          <div style={{fontSize:24,fontWeight:700,color:C.red}}>{redClients.length}</div>
          <div style={{fontSize:10,color:C.red,fontWeight:600,textTransform:'uppercase',marginTop:2}}>Needs Attention</div>
        </div>
        <div style={{flex:1,background:C.yellowDim,border:`1px solid ${C.yellowSoft}`,borderRadius:10,padding:'14px 18px',textAlign:'center'}}>
          <div style={{fontSize:24,fontWeight:700,color:C.yellow}}>{yellowClients.length}</div>
          <div style={{fontSize:10,color:C.yellow,fontWeight:600,textTransform:'uppercase',marginTop:2}}>Watch</div>
        </div>
        <div style={{flex:1,background:C.greenDim,border:`1px solid ${C.greenSoft}`,borderRadius:10,padding:'14px 18px',textAlign:'center'}}>
          <div style={{fontSize:24,fontWeight:700,color:C.green}}>{clients.length-redClients.length-yellowClients.length}</div>
          <div style={{fontSize:10,color:C.green,fontWeight:600,textTransform:'uppercase',marginTop:2}}>Healthy</div>
        </div>
      </div>}

      {/* Client cards */}
      <SH>{isAdmin?'All Clients':'Your Clients'}</SH>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:14}}>
        {sorted.map(cl=>{
          const h=healthMap[cl.id];
          const scope=scopeData[cl.id];
          const pm=getPM(cl.assigned_pm);
          const clientCreatorsCount=creators.filter(c=>c.client_id===cl.id&&c.status==='active').length;
          const checkedToday=hasCheckedIn(cl.id);

          return<Card key={cl.id} health={h?.status} hoverable onClick={()=>{setSelClient(cl);setView(isPM&&!checkedToday?'checkin':'clientDetail')}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
              <div style={{display:'flex',alignItems:'center',gap:10}}>
                <HealthDot status={h?.status}/>
                <div>
                  <div style={{fontSize:15,fontWeight:600}}>{cl.name}</div>
                  {cl.industry&&<div style={{fontSize:11,color:C.muted}}>{cl.industry}</div>}
                </div>
              </div>
              {isPM&&checkedToday&&<Badge label='✓ Done' color={C.green} bg={C.greenDim}/>}
            </div>

            {isAdmin&&<div style={{fontSize:11,color:C.sub,marginBottom:8}}>PM: {pm?.name||'—'} · {clientCreatorsCount} creator{clientCreatorsCount!==1?'s':''}</div>}

            {/* Quick metrics */}
            {h?.latest&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:8}}>
              <div style={{background:C.alt,borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Views 48h</div>
                <div style={{fontSize:14,fontWeight:600,marginTop:2}}>{h.latest.views_48h>=1000?(h.latest.views_48h/1000).toFixed(1)+'K':h.latest.views_48h}</div>
                {h.prev&&<div style={{fontSize:10,color:h.latest.views_48h>=h.prev.views_48h?C.green:C.red,marginTop:2}}>{h.latest.views_48h>=h.prev.views_48h?'↑':'↓'} vs prev</div>}
              </div>
              <div style={{background:C.alt,borderRadius:6,padding:'8px 10px'}}>
                <div style={{fontSize:9,color:C.muted,textTransform:'uppercase'}}>Likes 48h</div>
                <div style={{fontSize:14,fontWeight:600,marginTop:2}}>{h.latest.likes_48h>=1000?(h.latest.likes_48h/1000).toFixed(1)+'K':h.latest.likes_48h}</div>
                {h.prev&&<div style={{fontSize:10,color:h.latest.likes_48h>=h.prev.likes_48h?C.green:C.red,marginTop:2}}>{h.latest.likes_48h>=h.prev.likes_48h?'↑':'↓'} vs prev</div>}
              </div>
            </div>}

            {!h?.latest&&<div style={{color:C.muted,fontSize:12,fontStyle:'italic',marginTop:6}}>No data yet</div>}

            {/* Health flag */}
            {h?.issues?.length>0&&<div style={{marginTop:10,padding:'6px 10px',borderRadius:6,background:h.status==='red'?C.redDim:C.yellowDim,fontSize:11,color:h.status==='red'?C.red:C.yellow,fontWeight:500}}>{h.issues[0]}</div>}

            {/* Scope mini */}
            {scope&&<div style={{marginTop:10}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:10,color:C.muted,marginBottom:3}}>
                <span>Scope</span><span>{scope.live_posts}/{scope.scope_goal}</span>
              </div>
              <div style={{height:4,background:C.border,borderRadius:2,overflow:'hidden'}}><div style={{height:'100%',width:`${Math.min((scope.live_posts/scope.scope_goal)*100,100)}%`,background:scope.live_posts>=scope.scope_goal*0.9?C.green:scope.live_posts>=scope.scope_goal*0.6?C.yellow:C.red,borderRadius:2}}/></div>
            </div>}
          </Card>;
        })}
      </div>
    </div>;
  }

  // ═══════════════════════════════════════════════════════════════════
  // LAYOUT
  // ═══════════════════════════════════════════════════════════════════
  const sidebar=isAdmin
    ?[{id:'dashboard',label:'Dashboard',icon:'◉'},{id:'creators',label:'Manage Creators',icon:'♦'}]
    :[{id:'dashboard',label:'Dashboard',icon:'◉'}];

  return<div style={{fontFamily:F.body,background:C.bg,color:C.text,minHeight:'100vh',fontSize:14}}>
    <div style={{width:220,background:C.surface,borderRight:`1px solid ${C.border}`,height:'100vh',position:'fixed',left:0,top:0,display:'flex',flexDirection:'column',zIndex:10}}>
      <div style={{padding:'20px 16px',borderBottom:`1px solid ${C.border}`}}>
        <div style={{fontSize:11,fontWeight:700,color:C.accent,letterSpacing:'0.14em',textTransform:'uppercase'}}>BW Club</div>
        <div style={{fontSize:14,fontWeight:600,marginTop:3}}>Command Center</div>
      </div>
      <nav style={{padding:'12px 8px',flex:1}}>
        {sidebar.map(item=><div key={item.id} onClick={()=>nav(item.id)} style={{padding:'9px 12px',borderRadius:8,cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:2,fontSize:13,fontWeight:['dashboard','creators'].includes(view)&&view===item.id||view==='clientDetail'&&item.id==='dashboard'||view==='checkin'&&item.id==='dashboard'?600:400,color:['dashboard','clientDetail','checkin'].includes(view)&&item.id==='dashboard'||view===item.id?C.text:C.sub,background:['dashboard','clientDetail','checkin'].includes(view)&&item.id==='dashboard'||view===item.id?C.hover:'transparent'}} onMouseEnter={e=>e.currentTarget.style.background=C.hover} onMouseLeave={e=>{const active=['dashboard','clientDetail','checkin'].includes(view)&&item.id==='dashboard'||view===item.id;if(!active)e.currentTarget.style.background='transparent'}}>
          <span style={{fontSize:12,width:16,textAlign:'center'}}>{item.icon}</span>{item.label}
        </div>)}
      </nav>
      <div style={{padding:'12px',borderTop:`1px solid ${C.border}`,display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:isAdmin?C.accentDim:C.blueDim,color:isAdmin?C.accent:C.blue,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:700}}>{user.avatar}</div>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{user.name}</div><div style={{fontSize:10,color:C.muted}}>{user.title}</div></div>
        <Btn variant='ghost' onClick={()=>{setUser(null);nav('dashboard')}} sx={{padding:'4px 8px',fontSize:10}}>⏻</Btn>
      </div>
    </div>
    <div style={{marginLeft:220,minHeight:'100vh',padding:'28px 36px'}}>
      {view==='dashboard'&&<DashboardView/>}
      {view==='checkin'&&isPM&&<CheckinView/>}
      {view==='clientDetail'&&<ClientDetailView/>}
      {view==='creators'&&isAdmin&&<ManageCreatorsView/>}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
